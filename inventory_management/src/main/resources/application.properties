spring.application.name=inventory_management

# ===================================
# SERVER CONFIGURATION
# ===================================
# Run on port 8081 (8080 is used by Oracle TNS Listener)
server.port=8081

# ===================================
# DOCKER CONFIGURATION
# ===================================
# Disable auto-start Docker Compose (we'll run Docker manually)
spring.docker.compose.enabled=false

# ===================================
# DATABASE CONFIGURATION
# ===================================
# WHY? Spring Boot needs to know WHERE your database is and HOW to connect
# These values match your compose.yaml file

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

# ===================================
# JPA/HIBERNATE CONFIGURATION
# ===================================
# WHY? This tells Hibernate how to manage your database tables

# ddl-auto = update: Automatically create/update tables based on your @Entity classes
# This means: You create Category.java → PostgreSQL table "categories" is created automatically!
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (helpful for learning and debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate we're using PostgreSQL (not MySQL, Oracle, etc.)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

