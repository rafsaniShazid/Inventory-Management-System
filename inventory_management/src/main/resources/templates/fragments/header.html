<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">

        <a class="navbar-brand" href="/">📦 Inventory Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}" href="/dashboard">Dashboard</a>
                </li>
                <li class="nav-item" id="navRequestItem">
                    <a class="nav-link" th:href="@{/request}" href="/request">Request Item</a>
                </li>

                    <a class="nav-link" th:href="@{/my-requests}" href="/my-requests">My Requests</a>
                </li>

                </li>
                <li class="nav-item" id="navCategoriesAdmin" style="display: none;">
                    <a class="nav-link" th:href="@{/categories}" href="/categories">Manage Categories</a>
                </li>
                <li class="nav-item" id="navManageRequestsAdmin" style="display: none;">
                    <a class="nav-link" th:href="@{/manage-requests}" href="/manage-requests">Manage Requests</a>
                </li>

                <li class="nav-item" id="navLoginItem">
                    <a class="nav-link" th:href="@{/login}" href="/login">Login</a>
                </li>
                <li class="nav-item" id="navLogoutItem" style="display: none;">
                    <button class="btn btn-outline-light btn-sm ms-lg-2 mt-2 mt-lg-0" type="button" id="logoutBtn">Logout</button>

            </ul>
        </div>
    </div>

</html>
