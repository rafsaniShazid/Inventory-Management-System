<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Sign in</h1>
                        <p class="text-muted mb-4">Use your account to access protected inventory APIs.</p>

                        <div class="alert alert-danger d-none" id="authError" role="alert"></div>
                        <div class="alert alert-success d-none" id="authSuccess" role="alert"></div>

                        <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button" role="tab" aria-controls="loginPane" aria-selected="true">Login</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button" role="tab" aria-controls="registerPane" aria-selected="false">Register</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabContent">
                            <div class="tab-pane fade show active" id="loginPane" role="tabpanel" aria-labelledby="login-tab" tabindex="0">
                                <form id="loginForm" novalidate>
                                    <div class="mb-3">
                                        <label for="loginEmail" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="loginEmail" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="loginPassword" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="loginPassword" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100" id="loginSubmitBtn">Login</button>
                                </form>
                            </div>

                            <div class="tab-pane fade" id="registerPane" role="tabpanel" aria-labelledby="register-tab" tabindex="0">
                                <form id="registerForm" novalidate>
                                    <div class="mb-3">
                                        <label for="registerFullName" class="form-label">Full name</label>
                                        <input type="text" class="form-control" id="registerFullName" minlength="3" maxlength="120" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registerEmail" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="registerEmail" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registerPassword" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="registerPassword" minlength="6" maxlength="100" required>
                                    </div>
                                    <button type="submit" class="btn btn-outline-primary w-100" id="registerSubmitBtn">Create Account</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api/apiClient.js}"></script>
    <script th:src="@{/js/common/authNav.js}"></script>
    <script th:src="@{/js/pages/login.js}"></script>
</body>
</html>
