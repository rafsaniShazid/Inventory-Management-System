<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Requests - Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <main class="container-lg py-4">
        <div class="row mb-4">
            <div class="col">
                <h1>My Requests</h1>
                <p class="text-muted">Track the status of your inventory requests</p>
            </div>
        </div>

        <!-- Search / Filter Section -->
        <div class="row mb-4">
            <div class="col-lg-8 offset-lg-2">
                <div class="card">
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-md-8">
                                <label for="requesterEmail" class="form-label">Enter Email to View Requests</label>
                                <input type="email" class="form-control" id="requesterEmail" 
                                    placeholder="john@example.com" required>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button class="btn btn-primary w-100" onclick="searchRequests()">
                                    Search
                                </button>
                            </div>
                        </div>
                        <small class="form-text text-muted d-block mt-2">
                            ⚠️ This uses email-based identity. Once authentication is implemented, your email will be automatic.
                        </small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Filter Tabs -->
        <div class="row mb-4">
            <div class="col-lg-8 offset-lg-2">
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="all-tab" data-bs-toggle="tab" data-bs-target="#allRequests" 
                            type="button" role="tab" onclick="filterByStatus('ALL')">
                            All Requests
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pending-tab" data-bs-toggle="tab" data-bs-target="#pendingRequests" 
                            type="button" role="tab" onclick="filterByStatus('PENDING')">
                            Pending
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="approved-tab" data-bs-toggle="tab" data-bs-target="#approvedRequests" 
                            type="button" role="tab" onclick="filterByStatus('APPROVED')">
                            Approved
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="rejected-tab" data-bs-toggle="tab" data-bs-target="#rejectedRequests" 
                            type="button" role="tab" onclick="filterByStatus('REJECTED')">
                            Rejected
                        </button>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Requests Table -->
        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <!-- Error Message -->
                <div class="alert alert-danger d-none" id="errorMessage" role="alert"></div>

                <!-- Loading Spinner -->
                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <!-- Requests Container -->
                <div id="requestsContainer"></div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api/apiClient.js}"></script>
    <script th:src="@{/js/pages/my-requests.js}"></script>
</body>
</html>
