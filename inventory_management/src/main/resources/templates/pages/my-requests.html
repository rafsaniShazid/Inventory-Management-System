<!doctype html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Requests - Inventory Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <main class="container-lg py-4 my-requests-page">
      <div class="row mb-4">
        <div class="col">
          <h1>My Requests</h1>
          <p class="text-muted">
            Track request progress with live status and timeline details
          </p>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-lg-10 offset-lg-1">
          <div class="card my-requests-profile-card">
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-8">
                  <label for="requesterEmail" class="form-label"
                    >Account Email</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="requesterEmail"
                    placeholder="john@example.com"
                    required
                  />
                </div>
                <div class="col-md-4 d-flex align-items-end">
                  <button
                    class="btn btn-primary w-100"
                    onclick="searchRequests()"
                  >
                    Refresh Requests
                  </button>
                </div>
              </div>
              <small class="form-text text-muted d-block mt-2"
                >Requests are loaded for your signed-in account.</small
              >
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-lg-10 offset-lg-1">
          <div class="row g-3 my-requests-metrics">
            <div class="col-6 col-md-3">
              <div class="metric-card">
                <small>Total</small>
                <div id="metricAll" class="metric-value">0</div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="metric-card metric-pending">
                <small>Pending</small>
                <div id="metricPending" class="metric-value">0</div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="metric-card metric-approved">
                <small>Approved</small>
                <div id="metricApproved" class="metric-value">0</div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="metric-card metric-rejected">
                <small>Rejected</small>
                <div id="metricRejected" class="metric-value">0</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-lg-10 offset-lg-1">
          <ul class="nav nav-tabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="all-tab"
                data-bs-toggle="tab"
                data-bs-target="#allRequests"
                type="button"
                role="tab"
                onclick="filterByStatus('ALL')"
              >
                All <span id="allCount" class="ms-1 text-muted">(0)</span>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="pending-tab"
                data-bs-toggle="tab"
                data-bs-target="#pendingRequests"
                type="button"
                role="tab"
                onclick="filterByStatus('PENDING')"
              >
                Pending
                <span id="pendingCount" class="ms-1 text-muted">(0)</span>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="approved-tab"
                data-bs-toggle="tab"
                data-bs-target="#approvedRequests"
                type="button"
                role="tab"
                onclick="filterByStatus('APPROVED')"
              >
                Approved
                <span id="approvedCount" class="ms-1 text-muted">(0)</span>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="rejected-tab"
                data-bs-toggle="tab"
                data-bs-target="#rejectedRequests"
                type="button"
                role="tab"
                onclick="filterByStatus('REJECTED')"
              >
                Rejected
                <span id="rejectedCount" class="ms-1 text-muted">(0)</span>
              </button>
            </li>
          </ul>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-10 offset-lg-1">
          <div
            class="alert alert-danger d-none"
            id="errorMessage"
            role="alert"
          ></div>

          <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div id="requestsContainer"></div>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api/apiClient.js}"></script>
    <script th:src="@{/js/common/authNav.js}"></script>
    <script th:src="@{/js/pages/my-requests.js}"></script>
  </body>
</html>
