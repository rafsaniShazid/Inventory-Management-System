<!doctype html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - Inventory Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <main class="container-lg py-4">
      <div class="row mb-4">
        <div class="col">
          <h1>Dashboard</h1>
          <p class="text-muted">
            Overview of inventory requests and stock levels
          </p>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="row mb-4" id="statsContainer">
        <div class="loading-spinner" id="statsLoader">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <div
          class="error-message alert alert-danger"
          id="statsError"
          role="alert"
        ></div>
      </div>

      <!-- Items Overview Section -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="card">
            <div
              class="card-header d-flex justify-content-between align-items-center"
            >
              <h5 class="mb-0">Items Overview</h5>
              <small class="text-muted">Latest inventory items</small>
            </div>
            <div class="card-body" id="itemsOverviewContainer">
              <div class="loading-spinner" id="itemsOverviewLoader">
                <div class="spinner-border text-info" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
              <div
                class="error-message alert alert-danger"
                id="itemsOverviewError"
                role="alert"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Pending Requests Section -->
      <div class="row mb-4">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0">Pending Requests</h5>
            </div>
            <div class="card-body" id="pendingContainer">
              <div class="loading-spinner" id="pendingLoader">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
              <div
                class="error-message alert alert-danger"
                id="pendingError"
                role="alert"
              ></div>
            </div>
          </div>
        </div>

        <!-- Low Stock Alert -->
        <div class="col-lg-4">
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0">⚠️ Low Stock Items</h5>
            </div>
            <div class="card-body" id="lowStockContainer">
              <div class="loading-spinner" id="lowStockLoader">
                <div class="spinner-border text-warning" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
              <div
                class="error-message alert alert-danger"
                id="lowStockError"
                role="alert"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Approved Requests Section -->
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0">Recently Approved Requests</h5>
            </div>
            <div class="card-body" id="approvedContainer">
              <div class="loading-spinner" id="approvedLoader">
                <div class="spinner-border text-success" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
              <div
                class="error-message alert alert-danger"
                id="approvedError"
                role="alert"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api/apiClient.js}"></script>
    <script th:src="@{/js/common/authNav.js}"></script>
    <script th:src="@{/js/pages/dashboard.js}"></script>
  </body>
</html>
