name: Java CI with Maven

on:
  push:
    branches: [main, feature-*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        working-directory: ./inventory_management
        run: mvn -B clean compile --file pom.xml

      - name: Run tests
        working-directory: ./inventory_management
        run: mvn -B test --file pom.xml
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/mydatabase
          SPRING_DATASOURCE_USERNAME: myuser
          SPRING_DATASOURCE_PASSWORD: secret

      - name: Generate test report
        working-directory: ./inventory_management
        if: always()
        run: |
          if [ -d "target/surefire-reports" ]; then
            echo "✅ Tests completed"
            cat target/surefire-reports/*.txt || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: inventory_management/target/surefire-reports/

      - name: Package application
        working-directory: ./inventory_management
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-management-jar
          path: inventory_management/target/*.jar
