name: Java CI with Maven

on:
  push:
    branches: [main, feature-*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        working-directory: ./inventory_management
        run: chmod +x mvnw && ./mvnw -B clean compile

      - name: Run tests
        working-directory: ./inventory_management
        run: ./mvnw -B test -Dspring.profiles.active=test

      - name: Generate test report
        working-directory: ./inventory_management
        if: always()
        run: |
          if [ -d "target/surefire-reports" ]; then
            echo "✅ Tests completed"
            cat target/surefire-reports/*.txt || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: inventory_management/target/surefire-reports/

      - name: Package application
        working-directory: ./inventory_management
        run: ./mvnw -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-management-jar
          path: inventory_management/target/*.jar
